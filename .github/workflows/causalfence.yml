name: CausalFence

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install networkx pyyaml pytest boto3

      - name: Unit tests
        run: python -m pytest -v

      - name: CausalFence architecture check
        shell: bash
        run: |
          python -m causalfence architecture.yml | tee causalfence-report.txt
          echo '### CausalFence result' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat causalfence-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causalfence-report
          path: causalfence-report.txt

  gate:
    name: CausalFence gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install networkx pyyaml
      - name: Scan templates before deploy
        run: python -m causalfence.ci --template infra/template.yaml --comment causalfence-comment.md
      - name: Add report to the run summary
        if: always()
        run: |
          if [ -f causalfence-comment.md ]; then cat causalfence-comment.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Post or update the pull-request comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('causalfence-comment.md')) return;
            const body = fs.readFileSync('causalfence-comment.md', 'utf8');
            const marker = '<!-- causalfence-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causalfence-gate-report
          path: causalfence-comment.md

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CausalFence toy hospital app

Parameters:
  AuthMode:
    Type: String
    Default: safe
    AllowedValues: [safe, broken]

Conditions:
  IsSafe: !Equals [!Ref AuthMode, safe]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128

Resources:
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
      Tags:
        - Key: sensitivity
          Value: phi

  PatientLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/patient/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref PatientsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PatientsTable

  AuthLambda:
    Type: AWS::Serverless::Function
    Condition: IsSafe
    Properties:
      CodeUri: src/auth/
      Handler: app.handler

  HospitalApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "hospital-api-${AuthMode}"
      ProtocolType: HTTP

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HospitalApi
      StageName: $default
      AutoDeploy: true

  PatientIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HospitalApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PatientLambda.Arn
      PayloadFormatVersion: "2.0"

  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: IsSafe
    Properties:
      ApiId: !Ref HospitalApi
      Name: auth-lambda
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLambda.Arn}/invocations"
      AuthorizerPayloadFormatVersion: "2.0"
      EnableSimpleResponses: true
      AuthorizerResultTtlInSeconds: 0
      IdentitySource:
        - $request.header.Authorization

  PatientsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HospitalApi
      RouteKey: "ANY /patients"
      Target: !Sub "integrations/${PatientIntegration}"
      AuthorizationType: !If [IsSafe, CUSTOM, NONE]
      AuthorizerId: !If [IsSafe, !Ref ApiAuthorizer, !Ref "AWS::NoValue"]

  PatientInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PatientLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HospitalApi}/*/*/patients"

  AuthInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsSafe
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HospitalApi}/authorizers/${ApiAuthorizer}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${HospitalApi}.execute-api.${AWS::Region}.amazonaws.com/patients"
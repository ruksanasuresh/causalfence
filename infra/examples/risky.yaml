AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CausalFence demo - three common AWS weaknesses in one template (do not deploy)
Resources:
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
      Tags:
        - Key: sensitivity
          Value: phi
  ReportLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/patient/
      Handler: app.handler
      Runtime: python3.13
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action: "dynamodb:*"
              Resource: !GetAtt PatientsTable.Arn
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: sensitivity
          Value: phi
  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${ReportsBucket.Arn}/*"
